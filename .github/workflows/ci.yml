name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.3"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run Ruff (lint)
        run: poetry run ruff check src/ tests/

      - name: Run Ruff (format check)
        run: poetry run ruff format --check src/ tests/

      - name: Run MyPy (type check)
        run: poetry run mypy src/ --ignore-missing-imports

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: nim_sentinel_test
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: nim-sentinel-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if mongosh --eval "db.adminCommand('ping')" --quiet; then
              echo "MongoDB is ready"
              break
            fi
            sleep 2
          done

      - name: Create MongoDB indexes
        run: poetry run python scripts/create_indexes.py

      - name: Run unit tests
        run: poetry run pytest tests/ -v --tb=short -x --ignore=tests/test_integration.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ secrets.NVIDIA_API_KEY != '' }}
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: nim_sentinel_test
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: nim-sentinel-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if mongosh --eval "db.adminCommand('ping')" --quiet; then
              echo "MongoDB is ready"
              break
            fi
            sleep 2
          done

      - name: Create MongoDB indexes
        run: poetry run python scripts/create_indexes.py

      - name: Run integration tests
        run: poetry run pytest tests/test_integration.py -v --tb=short

  evaluations:
    name: Evaluations
    runs-on: ubuntu-latest
    if: ${{ secrets.NVIDIA_API_KEY != '' }}
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DATABASE: nim_sentinel_test
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: nim-sentinel-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if mongosh --eval "db.adminCommand('ping')" --quiet; then
              echo "MongoDB is ready"
              break
            fi
            sleep 2
          done

      - name: Create MongoDB indexes
        run: poetry run python scripts/create_indexes.py

      - name: Seed test data
        run: poetry run python scripts/seed_data.py --tenant test_tenant

      - name: Run evaluations
        run: poetry run python evals/run_evals.py --component all --fail-under 0.8 --output eval_results.json

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Build package
        run: poetry build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/