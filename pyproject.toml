[project]
name = "nim-sentinel"
version = "0.1.0"
description = "Enterprise Multi-Agent Knowledge & Operations Copilot (LangGraph + LangChain + NVIDIA NIM + MongoDB + LangSmith)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [
    {name = "NIM Sentinel Team", email = "team@nim-sentinel.dev"}
]
keywords = ["langgraph", "langchain", "nvidia", "nim", "mongodb", "rag", "agents", "genai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core orchestration
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    # Database
    "pymongo>=4.6.0",
    "langchain-mongodb>=0.1.0",
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Cache & Rate limiting
    "redis>=5.0.0",
    # Observability
    "langsmith>=0.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    # Riva ASR/TTS (gRPC)
    "nvidia-riva-client>=0.1.0",
    # Guardrails
    "nemoguardrails>=0.24.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Document processing
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    # Web research
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tenacity>=8.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-json-logger>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.5.0",
    "black>=24.3.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "testcontainers>=4.7.0",
    "faker>=25.0.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=1.0.0",
    "langsmith>=0.1.0",
]
ui = [
    "streamlit>=1.35.0",
    "streamlit-chat>=0.1.0",
]
deploy = [
    "docker>=7.0.0",
    "kubernetes>=30.0.0",
    "helm>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.5.0",
    "black>=24.3.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default args
]
per-file-ignores = { "tests/*" = ["S101", "S106"], "scripts/check_models.py" = ["T20"] }
format.quote-style = "double"
format.indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | ENV
  | build
  | dist
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
)/
'''

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "langchain",
    "langchain.*",
    "langgraph",
    "langgraph.*",
    "langsmith",
    "langsmith.*",
    "pydantic",
    "pydantic.*",
    "pydantic_settings",
    "pydantic_settings.*",
    "grpc",
    "grpc.*",
    "riva",
    "riva.*",
    "jose",
    "jose.*",
    "passlib",
    "passlib.*",
    "yaml",
    "structlog",
    "structlog.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "eval: Evaluation tests",
    "redteam: Red team tests",
]

[tool.coverage.run]
source = ["src/nim_sentinel"]
omit = [
    "*/tests/*",
    "*/evals/*",
    "*/scripts/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
